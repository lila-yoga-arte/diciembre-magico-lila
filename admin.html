
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administración · Diciembre Mágico</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      background: #9f6aa3;
      color: white;
      font-family: 'Poppins', sans-serif;
    }

    .container {
      max-width: 1050px;
      margin: auto;
    }

    h1 {
      color: #ece12a;
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      margin-top: 0;
      margin-bottom: 30px;
    }

    .panel, .door-card {
      background: rgba(255,255,255,.13);
      border: 1px solid rgba(255,255,255,.3);
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 20px;
    }

    input, textarea, select {
      width: 100%;
      padding: 12px;
      margin: 7px 0 16px;
      border: 0;
      border-radius: 9px;
      font: inherit;
      color: #49364c;
      background: white;
    }

    textarea {
      min-height: 180px;
      resize: vertical;
    }

    label {
      font-size: 14px;
      font-weight: 600;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 12px 18px;
      background: #ece12a;
      color: #49364c;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover { opacity: .88; }

    .secondary {
      background: white;
      margin-left: 8px;
    }

    .danger {
      background: #c64e3f;
      color: white;
    }

    .doors {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
      gap: 12px;
    }

    .door-card {
      margin: 0;
      text-align: center;
      padding: 16px 10px;
    }

    .door-card button {
      width: 100%;
      margin-top: 10px;
      padding: 9px;
    }

    .door-number {
      font-size: 28px;
      color: #ece12a;
      font-weight: 700;
    }

    .door-title {
      font-size: 13px;
      overflow-wrap: anywhere;
      min-height: 38px;
    }

    .status {
      font-size: 12px;
      opacity: .9;
    }

    .hidden { display: none !important; }

    #message {
      margin: 14px 0;
      font-size: 14px;
      font-weight: 500;
    }

    .checkbox-line {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 12px 0 20px;
    }

    .checkbox-line input {
      width: auto;
      margin: 0;
    }

    @media (max-width: 600px) {
      body { padding: 14px; }
      .panel { padding: 16px; }
      .secondary { margin: 8px 0 0; }
    }
  </style>
</head>

<body>
<div class="container">

  <h1>Diciembre Mágico</h1>
  <p class="subtitle">Panel privado de administración · LÎLÂ ♡</p>

  <section id="loginArea" class="panel">
    <h2>¡Hola, Yami! ♡</h2>
    <p>Ingresá para administrar tus 24 ventanitas.</p>

    <form id="loginForm">
      <label for="email">Email</label>
      <input id="email" type="email" required>

      <label for="password">Contraseña</label>
      <input id="password" type="password" required>

      <button type="submit">Ingresar</button>
    </form>
  </section>

  <section id="privateArea" class="hidden">
    <div class="panel">
      <h2>¡Hola, Yami! ♡</h2>
      <p>Desde acá podés preparar y publicar las 24 sorpresas.</p>
      <button id="logoutButton" class="secondary">Cerrar sesión</button>
    </div>

    <div class="panel">
      <h2>Mis 24 ventanitas</h2>
      <p>Elegí una puerta para editar su contenido.</p>
      <div id="doors" class="doors"></div>
    </div>

    <div id="editor" class="panel hidden">
      <h2 id="editorHeading">Editar ventanita</h2>

      <form id="doorForm">
        <input type="hidden" id="doorNumber">

        <label for="doorTitle">Título</label>
        <input id="doorTitle" type="text" placeholder="Ej: Una pausa para respirar">

        <label for="doorContent">Contenido</label>
        <textarea id="doorContent" placeholder="Escribí acá el contenido de esta ventanita..."></textarea>

        <label for="doorType">Tipo de contenido</label>
        <select id="doorType">
          <option value="texto">Texto</option>
          <option value="imagen">Imagen</option>
          <option value="video">Video</option>
          <option value="audio">Audio</option>
          <option value="pdf">PDF</option>
          <option value="enlace">Enlace</option>
          <option value="mixto">Mixto</option>
        </select>

        <label for="mediaUrl">Enlace del archivo o recurso (opcional)</label>
        <input id="mediaUrl" type="url" placeholder="https://...">

        <div class="checkbox-line">
          <input id="published" type="checkbox">
          <label for="published">Publicar esta ventanita</label>
        </div>

        <button type="submit">Guardar cambios</button>
        <button type="button" id="cancelButton" class="secondary">Cancelar</button>
      </form>
    </div>
  </section>

  <p id="message" role="status">Cargando...</p>
</div>

<script>
  const SUPABASE_URL = "https://gktohrkxtvednuwadlra.supabase.co";

  // Pegá acá la misma Publishable key que ya usaste en tu versión anterior.
  const SUPABASE_KEY = "sb_publishable_KEt1AR5Lbi0MAi9wP35RGQ_NEAJXTia";

  const client = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const loginArea = document.getElementById("loginArea");
  const privateArea = document.getElementById("privateArea");
  const message = document.getElementById("message");
  const doorsContainer = document.getElementById("doors");
  const editor = document.getElementById("editor");

  function showMessage(text) {
    message.textContent = text;
  }

  async function checkAdmin() {
    const { data: { session } } = await client.auth.getSession();

    if (!session) {
      loginArea.classList.remove("hidden");
      privateArea.classList.add("hidden");
      showMessage("");
      return;
    }

    const { data, error } = await client.rpc("is_admin");

    if (error || data !== true) {
      await client.auth.signOut();
      loginArea.classList.remove("hidden");
      privateArea.classList.add("hidden");
      showMessage("No se pudo verificar el acceso de administradora.");
      return;
    }

    loginArea.classList.add("hidden");
    privateArea.classList.remove("hidden");
    showMessage("Acceso autorizado ♡");
    await loadDoors();
  }

  document.getElementById("loginForm").addEventListener("submit", async (event) => {
    event.preventDefault();
    showMessage("Ingresando...");

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const { error } = await client.auth.signInWithPassword({
      email,
      password
    });

    if (error) {
      showMessage("No se pudo ingresar. Revisá el email y la contraseña.");
      return;
    }

    await checkAdmin();
  });

  document.getElementById("logoutButton").addEventListener("click", async () => {
    await client.auth.signOut();
    editor.classList.add("hidden");
    await checkAdmin();
  });

  async function loadDoors() {
    showMessage("Cargando ventanitas...");

    const { data, error } = await client
      .from("ventanitas")
      .select("*")
      .order("numero");

    if (error) {
      showMessage("No se pudieron cargar las ventanitas: " + error.message);
      return;
    }

    const savedDoors = data || [];
    doorsContainer.replaceChildren();

    for (let number = 1; number <= 24; number++) {
      const door = savedDoors.find(item => item.numero === number);

      const card = document.createElement("div");
      card.className = "door-card";

      const numberElement = document.createElement("div");
      numberElement.className = "door-number";
      numberElement.textContent = String(number).padStart(2, "0");

      const titleElement = document.createElement("div");
      titleElement.className = "door-title";
      titleElement.textContent = door?.titulo || "Sin título";

      const statusElement = document.createElement("div");
      statusElement.className = "status";
      statusElement.textContent = door
        ? (door.published ? "Publicada" : "Borrador")
        : "Sin crear";

      const editButton = document.createElement("button");
      editButton.textContent = "Editar";
      editButton.addEventListener("click", () => openEditor(number, door));

      card.append(numberElement, titleElement, statusElement, editButton);
      doorsContainer.appendChild(card);
    }

    showMessage("Tus 24 ventanitas están listas ♡");
  }

  function openEditor(number, door) {
    document.getElementById("doorNumber").value = number;
    document.getElementById("editorHeading").textContent =
      "Ventanita " + String(number).padStart(2, "0");

    document.getElementById("doorTitle").value = door?.titulo || "";
    document.getElementById("doorContent").value = door?.contenido || "";
    document.getElementById("doorType").value = door?.tipo_contenido || "texto";
    document.getElementById("mediaUrl").value = door?.media_url || "";
    document.getElementById("published").checked = door?.published || false;

    editor.classList.remove("hidden");
    editor.scrollIntoView({ behavior: "smooth" });
  }

  document.getElementById("cancelButton").addEventListener("click", () => {
    editor.classList.add("hidden");
  });

  document.getElementById("doorForm").addEventListener("submit", async (event) => {
    event.preventDefault();
    showMessage("Guardando cambios...");

    const number = Number(document.getElementById("doorNumber").value);

    const doorData = {
      numero: number,
      titulo: document.getElementById("doorTitle").value.trim(),
      contenido: document.getElementById("doorContent").value,
      tipo_contenido: document.getElementById("doorType").value,
      media_url: document.getElementById("mediaUrl").value.trim() || null,
      published: document.getElementById("published").checked,
      updated_at: new Date().toISOString()
    };

    const { error } = await client
      .from("ventanitas")
      .upsert(doorData, { onConflict: "numero" });

    if (error) {
      showMessage("No se pudo guardar: " + error.message);
      return;
    }

    editor.classList.add("hidden");
    showMessage("¡Ventanita guardada! ♡");
    await loadDoors();
  });

  checkAdmin();
</script>
</body>
</html>
